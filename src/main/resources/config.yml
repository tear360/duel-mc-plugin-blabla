# ============================================================
#  DuelPlugin Configuration
#  Minecraft Paper 1.21.4
# ============================================================

# ------------------------------------------------------------
# Server info
# Used in scoreboard, tab list, Discord embeds and default
# messages. You can use Minecraft color codes (e.g. &6) in name.
# ------------------------------------------------------------
server-info:
  name: "My Server"
  ip: "play.example.com"

# ------------------------------------------------------------
# Messages
# prefix: shown before most chat messages.
# default-language: language used for players who have not
#   chosen one. Available: EN, FR, DE, ES
# ------------------------------------------------------------
messages:
  default-language: "EN"
  prefix: "&8[&6Duel &ePlugin&8] &r"

# ------------------------------------------------------------
# Scoreboard
# title supports %server_name%.
# ------------------------------------------------------------
scoreboard:
  title: "&5&l%server_name% &d&lDuels"

# How often (in ticks) the scoreboard numbers refresh.
scoreboard-update-interval: 20

# ------------------------------------------------------------
# Tab list
# header supports %server_name%.
# ------------------------------------------------------------
tab:
  header: "&5%server_name%"

# ------------------------------------------------------------
# Auto-update
# github-repo: "owner/repo" used to check GitHub for new
#   releases. Leave empty to disable the update checker.
# github-token: ONLY needed if the repository is private.
#
# When github-auto-download is enabled, release JARs are saved to
# plugins/DuelPlugin/updates/. They are NEVER loaded automatically:
# verify the file, install it manually, then restart the server.
# github-update-sha256: optional SHA-256 of the release JAR. When set,
#   the downloaded file is rejected if the checksum does not match.
# ------------------------------------------------------------
github-repo: ""
github-token: ""
github-auto-download: false
github-update-sha256: ""

# ------------------------------------------------------------
# Discord
# ------------------------------------------------------------

# Legacy webhook (optional, kept for backward compatibility).
# The JDA bot below is preferred.
discord-webhook-url: ""

# JDA bot. Create an application at
# https://discord.com/developers/applications and invite the
# bot to your server with the required permissions.
discord:
  # Bot token. Leave empty to disable the Discord bot.
  bot-token: ""
  # ID of the forum channel used for /bugreport.
  bug-report-channel-id: ""
  # ID of the channel where duel results are posted.
  duel-result-channel-id: ""
  # ID of the forum channel used for /report.
  report-channel-id: ""